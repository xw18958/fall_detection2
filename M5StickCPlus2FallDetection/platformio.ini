[platformio]
src_dir = main
default_envs = m5stickc-plus2

[env:m5stickc-plus2]
platform = espressif32@6.13.0
board = m5stick-c
framework = espidf

monitor_speed = 115200
upload_speed = 1500000

; M5StickC PLUS2 uses ESP32-PICO-V3-02 with 8 MB flash and 2 MB PSRAM.
; PlatformIO's m5stick-c board definition is the closest official base board,
; so override the flash size and use this project's ESP-IDF PSRAM settings.
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions.csv
board_build.embed_files = main/model.tflite
