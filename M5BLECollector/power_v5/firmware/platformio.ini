[platformio]
src_dir = main
default_envs = m5stickc-plus2-ble

[env:m5stickc-plus2-ble]
platform = espressif32@6.13.0
board = m5stick-c
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions.csv
board_build.embed_files = main/model.tflite
extra_scripts = pre:../tools/build_guard.py

[env:m5stickc-plus2-internal-benchmark]
extends = env:m5stickc-plus2-ble
build_flags = -DCONFIG_FALL_INTERNAL_ARENA=1

[env:m5stickc-plus2-trigger-shadow]
extends = env:m5stickc-plus2-ble
build_flags = -DCONFIG_FALL_INTERNAL_ARENA=1 -DCONFIG_FALL_TRIGGER_MODEL=1

[env:m5stickc-plus2-parallel-benchmark]
extends = env:m5stickc-plus2-ble
build_flags = -DCONFIG_FALL_INTERNAL_ARENA=1 -DCONFIG_FALL_PARALLEL_CONV=1
